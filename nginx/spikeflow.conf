# ============================
# Upstream Servers
# ============================

upstream management_api {
    server spikeflow:4000;
}

upstream gateway_api {
    server spikeflow:4000;
}

# ============================
# SpikeFlow Server
# ============================

server {

    listen 80;
    server_name localhost;

    # ----------------------------
    # Logs
    # ----------------------------

    access_log /dev/stdout;
    error_log /dev/stderr;

    # ----------------------------
    # Client Limits
    # ----------------------------

    client_max_body_size 10M;

    # ----------------------------
    # Gzip Compression
    # ----------------------------

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        application/json
        application/graphql-response+json
        application/javascript
        text/plain
        text/css;

    # ----------------------------
    # Security Headers
    # ----------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =====================================================
    # Health Check
    # =====================================================

    location /health {
        default_type text/plain;
        return 200 "SpikeFlow Gateway Healthy";
    }

    # =====================================================
    # GraphQL Management API
    # http://localhost/graphql
    # =====================================================

    location /graphql {

        proxy_pass http://management_api;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # =====================================================
    # SpikeFlow Gateway
    # http://localhost/gateway
    # =====================================================

    location /gateway {

        proxy_pass http://gateway_api;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}