<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Outline -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    fill="#090d16"
    stroke="url(#hexBorder)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Network Connections (Lines) -->
  <g stroke="#334155" stroke-width="1.8" opacity="0.85">
    <line x1="28" y1="42" x2="48" y2="28" />
    <line x1="48" y1="28" x2="68" y2="40" />
    <line x1="28" y1="42" x2="35" y2="70" />
    <line x1="35" y1="70" x2="65" y2="68" />
    <line x1="68" y1="40" x2="65" y2="68" />
    <line x1="48" y1="28" x2="48" y2="52" />
    <line x1="35" y1="70" x2="48" y2="82" />
    <line x1="65" y1="68" x2="52" y2="82" />
  </g>

  <!-- Network Nodes (Dots) -->
  <circle cx="48" cy="28" r="4.5" fill="#0284c7" />
  <circle cx="28" cy="42" r="3.5" fill="#0369a1" />
  <circle cx="68" cy="40" r="4" fill="#0d9488" />
  <circle cx="35" cy="70" r="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="65" cy="68" r="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <circle cx="48" cy="82" r="2.5" fill="#64748b" />

  <!-- Dynamic Ascending Flow Curve with Arrow -->
  <path
    d="M 22 68 Q 36 68, 46 52 T 76 34"
    fill="none"
    stroke="url(#flowGradient)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Flow Origin Node -->
  <circle cx="22" cy="68" r="4.5" fill="#0284c7" stroke="#fff" stroke-width="1.5" />

  <!-- Arrow Head at top right -->
  <polygon
    points="74,25 86,30 78,40 76,33"
    fill="#14b8a6"
    filter="url(#glow)"
  />
</svg>
